openapi: 3.0.1
info:
  title: Task API
  description: "Rest API - Per la gestione di Task Asincroni"
  version: 1.0.0-SNAPSHOT

servers:
  - url: http://localhost:8082
    description: Generated server url

tags:
  - name: Task
    description: Gestione dei Task
  - name: Job
    description: Gestione dei Job

paths:
  /task:
    post:
      tags:
        - Task
      summary: Avvia un Task
      operationId: submitTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
        required: true
      responses:
        "200":
          $ref: '#/components/responses/JobResponse'
        "400":
          $ref: '#/components/responses/MessageResponse'

  /job:
    get:
      tags:
        - Job
      security: [ ]
      summary: Ritorna la lista dei Job
      operationId: search
      parameters:
        - name: id
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/JobStatus'

      responses:
        "200":
          $ref:  '#/components/responses/JobListResponse'
        "400":
          $ref: '#/components/responses/MessageResponse'

  /job/{id}/restart:
    post:
      tags:
        - Job
      summary: Riavvia un Job
      operationId: restartJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        "200":
          $ref: '#/components/responses/JobResponse'
        "400":
          $ref: '#/components/responses/MessageResponse'


components:
  responses:

    TaskListResponse:
      description: Lista di Task
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Task'

    JobResponse:
      description: Task
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Job'

    JobListResponse:
      description: Lista di Job
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Job'

    MessageResponse:
      description: Messaggio generico
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'

  schemas:

    Task:
      required:
        - name
      type: object
      properties:
        name:
          type: string
          description: Task name
        detail:
          type: string
          description: Task detail

    Job:
      required:
        - id
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        start-date:
          $ref: '#/components/schemas/DateTime'
        end-date:
          $ref: '#/components/schemas/DateTime'
        status:
          $ref: '#/components/schemas/JobStatus'
        message:
          type: string
        task:
          $ref: '#/components/schemas/Task'

    JobStatus:
      type: string
      enum:
        - RUNNING
        - COMPLETED
        - FAILED

    Message:
      required:
        - code
        - description
      type: object
      properties:
        code:
          type: string
          description: Codice risposta
          example: OK
        description:
          type: string
          description: Descrizione
          example: Operazione eseguita correttamente
        detail:
          type: string
          description: Descrizione dettagliata
          example: Operazione eseguita correttamente senza avvertimenti

    #############
    # TIPI BASE #
    #############
    Date:
      type: string
      format: date
      example: '2022-04-22'

    DateTime:
      type: string
      format: date-time

    Id:
      type: integer
      format: int64
